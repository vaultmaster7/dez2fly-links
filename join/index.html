<!doctype html><html lang="en"><head><meta charset="utf-8"><title>2Fly Crew membership — Dez2fly</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#0b0b0c;color:#ffb648;font:16px/1.4 -apple-system,system-ui,sans-serif;display:grid;place-items:center;height:100vh;text-align:center}a{color:#ffb648}</style>
<script>window.goatcounter={no_onload:true};</script>
<script data-goatcounter="https://dez2fly.goatcounter.com/count" async src="/count.js"></script>
<script>
// /join?s=<tag> — one-hop door to the newest MEMBERS-ONLY video (Sep 18 2026, Dez: "push YT memberships, easiest to convert right now").
// Lands on the locked video itself, not the generic /join page: YouTube shows the title + a Join button in context, which is the pitch.
// Tag map: chat = pinned live-chat message on the 24/7 stream, com = pinned comment under the stream, live = stream description,
// vid = long-form description/pinned comment, ig/tt = bios. Logs /visit-join-<tag> in GoatCounter, then redirects.
// When a newer members-only video drops, change ONLY the id below (and the fallback href) — the tags and counters stay.
(function(){
  var src=(new URLSearchParams(location.search).get('s')||'direct').replace(/[^a-z0-9_-]/gi,'').slice(0,20)||'direct';
  var dest='https://www.youtube.com/watch?v=E3uraPTbRVk';
  document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('go');if(a)a.href=dest;});
  var tries=0, sent=false;
  function fire(){ if(sent)return; if(window.goatcounter&&goatcounter.count){sent=true;goatcounter.count({path:'/visit-join-'+src,title:'Join door ('+src+')'});setTimeout(function(){location.replace(dest);},250);} else if(tries++<12){setTimeout(fire,200);} else {location.replace(dest);} }
  fire();
})();
</script></head>
<body><div>2Fly Crew — taking you to the members-only drop…<br><a id="go" href="https://www.youtube.com/watch?v=E3uraPTbRVk">tap here if it doesn't move</a></div></body></html>
